server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.json, index.html y version no se cachean (cambios deben verse ya).
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /config.json { add_header Cache-Control "no-cache"; default_type application/json; }
    location = /version { add_header Cache-Control "no-cache"; }

    # Element usa hash routing (#/), así que casi todo es archivo estático.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
